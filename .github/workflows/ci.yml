name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - '**.go'
      - go.mod
      - go.sum
      - internal/gui/page/**
      - Makefile
      - scripts/**
      - assets/**
      - install.sh
      - .github/workflows/ci.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
  # The release runs these checks on the tag before it builds anything.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build every release target
        run: make launcher-dist

  # Installs the latest release with the script the README tells people to pipe into sh.
  install:
    name: Install script (${{ matrix.os }})
    # It installs the previous release, so it says nothing about the one being built.
    if: ${{ !inputs.release }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest release
        env:
          CODEFLOWER_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          python3 - <<'PY'
          import errno
          import os
          import pty
          import sys

          pid, terminal = pty.fork()
          if pid == 0:
              os.execv("/bin/sh", ["sh", "install.sh"])
          os.write(terminal, b"y\n")
          while True:
              try:
                  output = os.read(terminal, 4096)
              except OSError as error:
                  if error.errno == errno.EIO:
                      break
                  raise
              if not output:
                  break
              sys.stdout.buffer.write(output)
              sys.stdout.buffer.flush()
          _, status = os.waitpid(pid, 0)
          if os.WIFEXITED(status):
              sys.exit(os.WEXITSTATUS(status))
          sys.exit(128 + os.WTERMSIG(status))
          PY
          "$CODEFLOWER_INSTALL_DIR/codeflower" --version
